services:
  api:
    build: ./api
    environment:
      DATABASE_URL: mysql+pymysql://atlas_app:${MYSQL_PASSWORD:-atlas_dev_password}@mysql:3306/atlas
      QDRANT_URL: http://qdrant:6333
      API_KEY: ${API_KEY:-local-dev-key-change-me}
      LLM_PROVIDER: ${LLM_PROVIDER:-none}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      EMBEDDING_MODEL: sentence-transformers/all-MiniLM-L6-v2
    ports: ["8000:8000"]
    depends_on:
      mysql: { condition: service_healthy }
      qdrant: { condition: service_started }
    volumes: ["./api/data:/app/data"]
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_dev_password}
      MYSQL_DATABASE: atlas
      MYSQL_USER: atlas_app
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-atlas_dev_password}
    ports: ["3307:3306"]
    volumes: ["mysql_data:/var/lib/mysql", "./sql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-root_dev_password}"]
      interval: 5s
      timeout: 5s
      retries: 20
  qdrant:
    image: qdrant/qdrant:latest
    ports: ["6333:6333"]
    volumes: ["qdrant_data:/qdrant/storage"]
  php:
    build: ./php
    environment:
      ATLAS_API_KEY: ${API_KEY:-local-dev-key-change-me}
    ports: ["8080:80"]
    volumes: ["./php:/var/www/html"]
    depends_on: [api]
volumes:
  mysql_data:
  qdrant_data: